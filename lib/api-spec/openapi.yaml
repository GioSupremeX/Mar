openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: guestbook
  - name: artworks
  - name: settings
  - name: admin
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login with password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
        "401":
          description: Wrong password

  /artworks:
    get:
      operationId: listArtworks
      tags: [artworks]
      summary: List all artworks
      responses:
        "200":
          description: List of artworks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Artwork"
    post:
      operationId: createArtwork
      tags: [artworks]
      summary: Create artwork (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtworkInput"
      responses:
        "201":
          description: Artwork created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artwork"
        "400":
          description: Invalid input
        "401":
          description: Unauthorized

  /artworks/{id}:
    put:
      operationId: updateArtwork
      tags: [artworks]
      summary: Update artwork (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtworkInput"
      responses:
        "200":
          description: Artwork updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artwork"
        "404":
          description: Not found
        "401":
          description: Unauthorized
    delete:
      operationId: deleteArtwork
      tags: [artworks]
      summary: Delete artwork (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "401":
          description: Unauthorized

  /settings:
    get:
      operationId: getSiteSettings
      tags: [settings]
      summary: Get all site settings
      responses:
        "200":
          description: Site settings object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
    put:
      operationId: updateSiteSettings
      tags: [settings]
      summary: Update site settings (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteSettingsInput"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteSettings"
        "401":
          description: Unauthorized

  /guestbook:
    get:
      operationId: listGuestbookMessages
      tags: [guestbook]
      summary: List guestbook messages
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuestbookMessage"
    post:
      operationId: createGuestbookMessage
      tags: [guestbook]
      summary: Leave a guestbook message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestbookMessageInput"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestbookMessage"
        "400":
          description: Invalid input

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /guestbook/{id}:
    delete:
      operationId: deleteGuestbookMessage
      tags: [guestbook]
      summary: Delete guestbook message (admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "401":
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    AdminLoginInput:
      type: object
      required: [password]
      properties:
        password:
          type: string

    AdminLoginResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string

    Artwork:
      type: object
      required: [id, title, category, imageUrl, position, createdAt]
      properties:
        id:
          type: integer
        title:
          type: string
        category:
          type: string
        imageUrl:
          type: string
        description:
          type: ["string", "null"]
        position:
          type: integer
        createdAt:
          type: string
          format: date-time

    ArtworkInput:
      type: object
      required: [title, category, imageUrl]
      properties:
        title:
          type: string
          maxLength: 100
        category:
          type: string
          maxLength: 50
        imageUrl:
          type: string
        description:
          type: string
          maxLength: 500
        position:
          type: integer

    SiteSettings:
      type: object
      required: [artistName, tagline, bio, heroSubtitle, accentColor]
      properties:
        artistName:
          type: string
        tagline:
          type: string
        bio:
          type: string
        heroSubtitle:
          type: string
        accentColor:
          type: string
        avatarUrl:
          type: string
        heroStats:
          type: string
        moodBoard:
          type: string
        trophies:
          type: string
        games:
          type: string
        journey:
          type: string
        currentObsession:
          type: string
        hobbies:
          type: string

    SiteSettingsInput:
      type: object
      properties:
        artistName:
          type: string
          maxLength: 80
        tagline:
          type: string
          maxLength: 120
        bio:
          type: string
          maxLength: 1000
        heroSubtitle:
          type: string
          maxLength: 200
        accentColor:
          type: string
          maxLength: 20
        avatarUrl:
          type: string
          maxLength: 500
        heroStats:
          type: string
          maxLength: 2000
        moodBoard:
          type: string
          maxLength: 4000
        trophies:
          type: string
          maxLength: 4000
        games:
          type: string
          maxLength: 4000
        journey:
          type: string
          maxLength: 4000
        currentObsession:
          type: string
          maxLength: 500
        hobbies:
          type: string
          maxLength: 2000

    GuestbookMessage:
      type: object
      required: [id, name, message, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        message:
          type: string
        emoji:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    GuestbookMessageInput:
      type: object
      required: [name, message]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        message:
          type: string
          minLength: 1
          maxLength: 300
        emoji:
          type: string
          maxLength: 10

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
