openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: guestbook
    description: Guestbook message operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /guestbook:
    get:
      operationId: listGuestbookMessages
      tags: [guestbook]
      summary: List guestbook messages
      description: Returns all guestbook messages sorted by newest first
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GuestbookMessage"
    post:
      operationId: createGuestbookMessage
      tags: [guestbook]
      summary: Leave a guestbook message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestbookMessageInput"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestbookMessage"
        "400":
          description: Invalid input

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    GuestbookMessage:
      type: object
      required: [id, name, message, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        message:
          type: string
        emoji:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    GuestbookMessageInput:
      type: object
      required: [name, message]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        message:
          type: string
          minLength: 1
          maxLength: 300
        emoji:
          type: string
          maxLength: 10
